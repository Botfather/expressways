name: Release

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to stamp in artifact metadata (for example v0.1.0-alpha.1)"
        required: false
      release_channel:
        description: "Release channel override"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - alpha
          - beta
          - stable
      release_notes:
        description: "Optional release notes text (uses RELEASE_NOTES.md when empty)"
        required: false
      include_console_bundle:
        description: "Build unsigned Tauri console desktop bundles"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      signing_mode:
        description: "Release signing mode"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - required
          - disabled
  push:
    tags:
      - "v*"

env:
  RELEASE_NOTES_PATH: RELEASE_NOTES.md

jobs:
  build-artifacts:
    name: Build ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            artifact_name: expressways-desktop-macos-aarch64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact_name: expressways-desktop-linux-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Resolve release notes
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          NOTES_INPUT="${{ github.event.inputs.release_notes }}"
          if [[ -n "$NOTES_INPUT" ]]; then
            printf '%s\n' "$NOTES_INPUT" > ./tmp-release-notes.md
          elif [[ -f "$RELEASE_NOTES_PATH" ]]; then
            cp "$RELEASE_NOTES_PATH" ./tmp-release-notes.md
          else
            TAG_INPUT="${{ github.event.inputs.release_tag }}"
            TAG="${TAG_INPUT:-${GITHUB_REF_NAME:-v0.0.0-manual}}"
            printf 'Release %s\n\n- Generated by release-skeleton workflow.\n' "$TAG" > ./tmp-release-notes.md
          fi
          echo "path=./tmp-release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Build broker and CLI binaries
        run: cargo build --release --target ${{ matrix.target }} -p expressways-server -p expressways-client --bin expresswaysctl

      - name: Stage artifact directory
        shell: bash
        run: |
          set -euo pipefail
          STAGE_ROOT="dist/${{ matrix.artifact_name }}"
          mkdir -p "$STAGE_ROOT/bin" "$STAGE_ROOT/configs" "$STAGE_ROOT/scripts"
          cp "target/${{ matrix.target }}/release/expressways-server" "$STAGE_ROOT/bin/"
          cp "target/${{ matrix.target }}/release/expresswaysctl" "$STAGE_ROOT/bin/"
          cp "configs/expressways.example.toml" "$STAGE_ROOT/configs/"
          cp "scripts/expressways-service.sh" "$STAGE_ROOT/scripts/"
          chmod +x "$STAGE_ROOT/scripts/expressways-service.sh"
          cp "LICENSE" "$STAGE_ROOT/LICENSE"
          cp "README.md" "$STAGE_ROOT/README.md"
          cp "${{ steps.notes.outputs.path }}" "$STAGE_ROOT/release-notes.md"

          (
            cd "$STAGE_ROOT"
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum \
                "bin/expressways-server" \
                "bin/expresswaysctl" \
                "configs/expressways.example.toml" \
                "scripts/expressways-service.sh" \
                "LICENSE" \
                "README.md" \
                "release-notes.md" > checksums.txt
            else
              shasum -a 256 \
                "bin/expressways-server" \
                "bin/expresswaysctl" \
                "configs/expressways.example.toml" \
                "scripts/expressways-service.sh" \
                "LICENSE" \
                "README.md" \
                "release-notes.md" > checksums.txt
            fi
          )

      - name: Archive artifact
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          tar -czf "${{ matrix.artifact_name }}.tar.gz" "${{ matrix.artifact_name }}"

      - name: Generate checksum
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.artifact_name }}.tar.gz" > "${{ matrix.artifact_name }}.sha256"
          else
            shasum -a 256 "${{ matrix.artifact_name }}.tar.gz" > "${{ matrix.artifact_name }}.sha256"
          fi

      - name: Upload artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/${{ matrix.artifact_name }}.tar.gz
            dist/${{ matrix.artifact_name }}.sha256

  rollback-compatibility:
    name: Rollback Artifact Compatibility (Skeleton)
    runs-on: ubuntu-latest
    needs: build-artifacts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all bundles
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Verify rollback-compatible bundle layout
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t bundles < <(find dist -name '*.tar.gz' | sort)
          if [[ "${#bundles[@]}" -eq 0 ]]; then
            echo "No bundle artifacts were downloaded."
            exit 1
          fi
          bash scripts/check-rollback-artifact-compatibility.sh "${bundles[@]}"

  release-manifest:
    name: Build and Validate Release Manifest (Skeleton)
    runs-on: ubuntu-latest
    needs:
      - build-artifacts
      - rollback-compatibility
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all bundles
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Ensure jq is available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi

      - name: Resolve manifest metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          TAG_INPUT="${{ github.event.inputs.release_tag }}"
          VERSION="${TAG_INPUT:-${GITHUB_REF_NAME:-v0.0.0-manual}}"

          CHANNEL_INPUT="${{ github.event.inputs.release_channel }}"
          if [[ -n "$CHANNEL_INPUT" && "$CHANNEL_INPUT" != "auto" ]]; then
            CHANNEL="$CHANNEL_INPUT"
          else
            LOWER_VERSION="$(echo "$VERSION" | tr '[:upper:]' '[:lower:]')"
            if [[ "$LOWER_VERSION" == *"alpha"* ]]; then
              CHANNEL="alpha"
            elif [[ "$LOWER_VERSION" == *"beta"* ]]; then
              CHANNEL="beta"
            else
              CHANNEL="stable"
            fi
          fi

          NOTES_INPUT="${{ github.event.inputs.release_notes }}"
          if [[ -n "$NOTES_INPUT" ]]; then
            NOTES="$NOTES_INPUT"
          elif [[ -f "$RELEASE_NOTES_PATH" ]]; then
            NOTES="$(sed -n '1,60p' "$RELEASE_NOTES_PATH" | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g; s/^ //; s/ $//')"
          else
            NOTES="Release ${VERSION} generated by release-skeleton workflow."
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build published checksum index
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t checksum_files < <(find dist -name '*.sha256' | sort)
          if [[ "${#checksum_files[@]}" -eq 0 ]]; then
            echo "No checksum files found under dist."
            exit 1
          fi

          : > dist/release-checksums.txt
          for file in "${checksum_files[@]}"; do
            checksum="$(awk '{print $1}' "$file")"
            bundle="$(basename "$file" .sha256).tar.gz"
            printf '%s  %s\n' "$checksum" "$bundle" >> dist/release-checksums.txt
          done

      - name: Generate release SBOM
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/generate-release-sbom.sh \
            --output dist/release-sbom.cdx.json \
            --release-version "${{ steps.metadata.outputs.version }}" \
            --release-channel "${{ steps.metadata.outputs.channel }}"

      - name: Compose release manifest
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t checksum_files < <(find dist -name '*.sha256' | sort)
          if [[ "${#checksum_files[@]}" -eq 0 ]]; then
            echo "No checksum files found under dist."
            exit 1
          fi

          artifacts='[]'
          checksums='{}'
          for file in "${checksum_files[@]}"; do
            checksum="$(awk '{print $1}' "$file")"
            bundle="$(basename "$file" .sha256).tar.gz"
            artifacts="$(jq --arg bundle "$bundle" --arg sha "$checksum" '. + [{"bundle":$bundle,"sha256":$sha}]' <<<"$artifacts")"
            checksums="$(jq --arg bundle "$bundle" --arg sha "$checksum" '. + {($bundle):$sha}' <<<"$checksums")"
          done

          if command -v sha256sum >/dev/null 2>&1; then
            release_checksums_sha="$(sha256sum dist/release-checksums.txt | awk '{print $1}')"
            sbom_sha="$(sha256sum dist/release-sbom.cdx.json | awk '{print $1}')"
          else
            release_checksums_sha="$(shasum -a 256 dist/release-checksums.txt | awk '{print $1}')"
            sbom_sha="$(shasum -a 256 dist/release-sbom.cdx.json | awk '{print $1}')"
          fi

          checksums="$(jq --arg path "release-checksums.txt" --arg sha "$release_checksums_sha" '. + {($path):$sha}' <<<"$checksums")"
          checksums="$(jq --arg path "release-sbom.cdx.json" --arg sha "$sbom_sha" '. + {($path):$sha}' <<<"$checksums")"

          jq -n \
            --arg channel "${{ steps.metadata.outputs.channel }}" \
            --arg version "${{ steps.metadata.outputs.version }}" \
            --arg generated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg notes "${{ steps.metadata.outputs.notes }}" \
            --arg sbom_path "release-sbom.cdx.json" \
            --arg sbom_sha "$sbom_sha" \
            --argjson artifacts "$artifacts" \
            --argjson checksums "$checksums" \
            '{
              channel: $channel,
              version: $version,
              generated_at: $generated_at,
              notes: $notes,
              checksums: $checksums,
              artifacts: $artifacts,
              sbom: {
                format: "cyclonedx-json",
                path: $sbom_path,
                sha256: $sbom_sha
              }
            }' \
            > dist/release-manifest.json

      - name: Resolve signing mode
        id: signing-mode
        shell: bash
        run: |
          set -euo pipefail
          MODE_INPUT="${{ github.event.inputs.signing_mode }}"
          MODE="${MODE_INPUT:-auto}"
          REQUIRED="false"
          ENABLED="true"

          if [[ "$MODE" == "required" ]]; then
            REQUIRED="true"
          elif [[ "$MODE" == "disabled" ]]; then
            ENABLED="false"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            REQUIRED="true"
          fi

          echo "enabled=$ENABLED" >> "$GITHUB_OUTPUT"
          echo "required=$REQUIRED" >> "$GITHUB_OUTPUT"

      - name: Materialize release signing key
        id: signing-key
        if: ${{ steps.signing-mode.outputs.enabled == 'true' }}
        shell: bash
        env:
          RELEASE_SIGNING_PRIVATE_KEY_PEM: ${{ secrets.EXPRESSWAYS_RELEASE_SIGNING_PRIVATE_KEY_PEM }}
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_SIGNING_PRIVATE_KEY_PEM}" ]]; then
            if [[ "${{ steps.signing-mode.outputs.required }}" == "true" ]]; then
              echo "Release signing is required but secret EXPRESSWAYS_RELEASE_SIGNING_PRIVATE_KEY_PEM is not configured."
              exit 1
            fi
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Release signing key unavailable; skipping detached signatures for this run."
            exit 0
          fi

          mkdir -p dist
          printf '%s\n' "${RELEASE_SIGNING_PRIVATE_KEY_PEM}" > dist/release-signing-private.pem
          chmod 600 dist/release-signing-private.pem
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Sign release outputs
        if: ${{ steps.signing-mode.outputs.enabled == 'true' && steps.signing-key.outputs.available == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t bundles < <(find dist -name '*.tar.gz' | sort)
          targets=("${bundles[@]}" "dist/release-checksums.txt" "dist/release-sbom.cdx.json")
          bash scripts/sign-release-artifacts.sh \
            --private-key dist/release-signing-private.pem \
            --manifest-output dist/release-signatures.json \
            "${targets[@]}"

      - name: Attach signatures to release manifest
        if: ${{ steps.signing-mode.outputs.enabled == 'true' && steps.signing-key.outputs.available == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          tmp_manifest="$(mktemp)"
          jq --slurpfile signatures dist/release-signatures.json '. + {signatures: $signatures[0]}' dist/release-manifest.json > "$tmp_manifest"
          mv "$tmp_manifest" dist/release-manifest.json

      - name: Remove private signing key from workspace
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f dist/release-signing-private.pem

      - name: Validate release manifest schema constraints
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/validate-release-manifest.sh dist/release-manifest.json

      - name: Upload release manifest and schema
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: |
            dist/release-manifest.json
            dist/release-checksums.txt
            dist/release-sbom.cdx.json
            dist/release-signatures.json
            dist/release-signing-public.pem
            dist/**/*.sig
            .github/release-manifest.schema.json

  console-desktop-bundle:
    name: Build Console Desktop Bundle (Unsigned Skeleton)
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.include_console_bundle == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            bundle_target: app
            artifact_name: expressways-console-macos-app
          - os: ubuntu-22.04
            bundle_target: appimage
            artifact_name: expressways-console-linux-appimage
    defaults:
      run:
        working-directory: apps/expressways-console
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: apps/expressways-console/pnpm-lock.yaml

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.28.2"

      - name: Install Linux bundle dependencies
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install console dependencies
        run: pnpm install --frozen-lockfile

      - name: Build unsigned Tauri bundle
        run: pnpm build:tauri -- --bundles ${{ matrix.bundle_target }}

      - name: Archive console bundle
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_ROOT="src-tauri/target/release/bundle"
          STAGE_ROOT="../../dist/${{ matrix.artifact_name }}"
          mkdir -p "$STAGE_ROOT"
          cp -R "$BUNDLE_ROOT" "$STAGE_ROOT/bundle"
          tar -czf "../../dist/${{ matrix.artifact_name }}.tar.gz" -C ../../dist "${{ matrix.artifact_name }}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "../../dist/${{ matrix.artifact_name }}.tar.gz" > "../../dist/${{ matrix.artifact_name }}.sha256"
          else
            shasum -a 256 "../../dist/${{ matrix.artifact_name }}.tar.gz" > "../../dist/${{ matrix.artifact_name }}.sha256"
          fi

      - name: Upload console bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/${{ matrix.artifact_name }}.tar.gz
            dist/${{ matrix.artifact_name }}.sha256

  publish-release:
    name: Publish GitHub Release
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    needs:
      - release-manifest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets

      - name: Publish immutable tag release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find release-assets -type f \( \
            -name '*.tar.gz' -o \
            -name '*.sha256' -o \
            -name 'release-checksums.txt' -o \
            -name 'release-manifest.json' -o \
            -name 'release-sbom.cdx.json' -o \
            -name 'release-signatures.json' -o \
            -name 'release-signing-public.pem' -o \
            -name '*.sig' \
          \) | sort)
          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo "No release assets were downloaded."
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
