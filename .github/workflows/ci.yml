name: CI

on:
  push:
    branches:
      - main
      - master
      - "codex/**"
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo Check (Nanobot System)
        run: cargo check -p expressways-nanobot-system

      - name: Cargo Test (Nanobot System)
        run: cargo test -p expressways-nanobot-system

  console-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/expressways-console
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: apps/expressways-console/pnpm-lock.yaml

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.28.2"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Console
        run: pnpm build
