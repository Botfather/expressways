[graph]
all-features = true
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
]

[advisories]
ignore = [
  { id = "RUSTSEC-2025-0141", reason = "Bincode preserves the alpha segment format; frames and decoder input are bounded. Replace through an explicit storage migration before 1.0." },
  { id = "RUSTSEC-2025-0057", reason = "Unmaintained fxhash is transitive through current Tauri HTML parsing and is not used by the broker runtime." },
  { id = "RUSTSEC-2024-0370", reason = "Unmaintained proc-macro-error is a build-time transitive dependency of Tauri's Linux GTK stack." },
  { id = "RUSTSEC-2025-0081", reason = "Unmaintained rust-unic component is transitive through Tauri urlpattern; removal requires an upstream Tauri update." },
  { id = "RUSTSEC-2025-0075", reason = "Unmaintained rust-unic component is transitive through Tauri urlpattern; removal requires an upstream Tauri update." },
  { id = "RUSTSEC-2025-0080", reason = "Unmaintained rust-unic component is transitive through Tauri urlpattern; removal requires an upstream Tauri update." },
  { id = "RUSTSEC-2025-0100", reason = "Unmaintained rust-unic component is transitive through Tauri urlpattern; removal requires an upstream Tauri update." },
  { id = "RUSTSEC-2025-0098", reason = "Unmaintained rust-unic component is transitive through Tauri urlpattern; removal requires an upstream Tauri update." },
]

[licenses]
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "simplest-path"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
